<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-label="pinGo logo" xmlns:c2pa="http://c2pa.org/manifest">
  <title>pinGo</title>
  <style>
    :root { --text: #1f2937; --sub: #64748b; }
    @media (prefers-color-scheme: dark) { :root { --text: #f1f5f9; --sub: #94a3b8; } }
    .word { font: 800 92px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -2px; }
    .tag { font: 500 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; fill: var(--sub); }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5DC9E2"/>
      <stop offset="1" stop-color="#00ADD8"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(20,30)">
    <rect width="160" height="160" rx="36" fill="url(#g)"/>
    <!-- ping rings -->
    <circle cx="80" cy="80" r="62" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="3"/>
    <circle cx="80" cy="80" r="42" fill="none" stroke="#fff" stroke-opacity=".30" stroke-width="3"/>
    <!-- heartbeat line -->
    <polyline points="20,84 52,84 66,52 86,116 100,76 108,84 140,84"
              fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="140" cy="84" r="9" fill="#fff"/>
  </g>

  <!-- Wordmark -->
  <text x="210" y="125" class="word"><tspan fill="var(--text)">pin</tspan><tspan fill="#00ADD8">Go</tspan></text>
  <text x="214" y="165" class="tag">FAST WEBSITE HEALTH CHECKER</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
